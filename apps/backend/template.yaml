AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ESN GO backend - HTTP API + Lambda + DynamoDB + S3/CloudFront (harita 1.8 ile eklenecek)
# ---------------------------------------------------------------------------
# Parametreler: her ortam (dev, dev-<isim>, staging, prod) aynı şablonu kullanır.
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Description: Ortam adı. Kaynak adlarına önek olarak eklenir.
    AllowedPattern: "^(dev|staging|prod|dev-[a-z0-9]+)$"
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: API ve S3 yükleme için izin verilen site adresleri (CORS).
    Default: "http://localhost:3000"
  # 1.8'de (harita anahtarı) kullanılacak. samconfig.toml bu değeri gönderdiği için şimdiden tanımlı.
  MapReferers:
    Type: CommaDelimitedList
    Description: Harita API anahtarının çalışacağı sayfa adresleri.
    Default: "http://localhost:3000/*"
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30, 60, 90]

# ---------------------------------------------------------------------------
# Prod'a özel ayarlar (silme koruması, PITR)
# ---------------------------------------------------------------------------
Conditions:
  IsProd: !Equals [!Ref Stage, prod]

# ---------------------------------------------------------------------------
# Tüm Lambda'lar için ortak ayarlar
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    CodeUri: ./
    Environment:
      Variables:
        STAGE: !Ref Stage
        NODE_OPTIONS: --enable-source-maps
        MEDIA_BUCKET: !Ref MediaBucket
        MEDIA_CDN_DOMAIN: !GetAtt MediaCdn.DomainName

Resources:
  # =========================================================================
  # DynamoDB (1.6): tasarım ve erişim kalıpları için apps/backend/README.md
  # =========================================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub esngo-${Stage}-users
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  CitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub esngo-${Stage}-cities
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: cityId
          AttributeType: S
      KeySchema:
        - AttributeName: cityId
          KeyType: HASH

  PlacesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub esngo-${Stage}-places
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: placeId
          AttributeType: S
        - AttributeName: publishedCityId
          AttributeType: S
        - AttributeName: publishedAll
          AttributeType: S
        - AttributeName: authorId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: placeId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Şehir sayfası + Explore şehir filtresi: sadece yayındakiler (sparse)
        - IndexName: byCity
          KeySchema:
            - AttributeName: publishedCityId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Explore "Tümü": sadece yayındakiler (sparse)
        - IndexName: byPublished
          KeySchema:
            - AttributeName: publishedAll
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # "Mekanlarım" + admin: bir ESNer'ın tüm mekanları (gizliler dahil)
        - IndexName: byAuthor
          KeySchema:
            - AttributeName: authorId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  GuidesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub esngo-${Stage}-guides
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: guideId
          AttributeType: S
      KeySchema:
        - AttributeName: guideId
          KeyType: HASH
  
  # =========================================================================
  # S3 + CloudFront (medya, 1.7)
  # =========================================================================
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub esngo-${Stage}-media-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  MediaOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub esngo-${Stage}-media-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub esngo-${Stage}-media
        HttpVersion: http2and3
        Origins:
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt MediaOac.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: media
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCdn}
  
  # =========================================================================
  # Amazon Location (1.8): tarayıcıda harita için API anahtarı (arama yetkisi yok)
  # =========================================================================
  MapsApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub esngo-${Stage}-maps
      Description: Browser map tiles for ESN GO
      NoExpiry: true
      Restrictions:
        AllowActions: ["geo-maps:*"]
        AllowResources:
          - !Sub arn:aws:geo-maps:${AWS::Region}::provider/default
        AllowReferers: !Ref MapReferers

  # =========================================================================
  # API Gateway (HTTP API)
  # =========================================================================
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /esngo/${Stage}/api-access
      RetentionInDays: !Ref LogRetentionDays

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: !Sub ESN GO API (${Stage})
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency","error":"$context.error.message","authError":"$context.authorizer.error"}'
      Auth:
        DefaultAuthorizer: EsnJwt
        Authorizers:
          EsnJwt:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers: [Authorization]
              ReauthorizeEvery: 300

  # =========================================================================
  # Lambda fonksiyonları
  # =========================================================================

  # --- Authorizer: her korumalı istekte JWT'yi doğrular -------------------
  AuthorizerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /esngo/${Stage}/authorizer
      RetentionInDays: !Ref LogRetentionDays

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/functions/authorizer/handler.ts]
    Properties:
      FunctionName: !Sub esngo-${Stage}-authorizer
      Handler: handler.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AuthorizerLogs

  # --- AuthController: ESN Accounts CAS giriş akışı (2.1) ----------------
  AuthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /esngo/${Stage}/auth
      RetentionInDays: !Ref LogRetentionDays

  AuthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/functions/auth/handler.ts]
    Properties:
      FunctionName: !Sub esngo-${Stage}-auth
      Handler: handler.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AuthLogs
      Events:
        Callback:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/callback
            Method: POST
            Auth:
              Authorizer: NONE
        Refresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /auth/me
            Method: GET

  # --- ContentService: şehirler, yerler, rehberler, görsel yükleme --------
  ContentLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /esngo/${Stage}/content
      RetentionInDays: !Ref LogRetentionDays

  ContentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/functions/content/handler.ts]
    Properties:
      FunctionName: !Sub esngo-${Stage}-content
      Handler: handler.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ContentLogs
      Policies:
        - Statement:
            - Sid: PresignedUploadsOnly
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${MediaBucket.Arn}/uploads/*
            - Sid: PlaceLookup
              Effect: Allow
              Action:
                - geo-places:Suggest
                - geo-places:GetPlace
              Resource: !Sub arn:aws:geo-places:${AWS::Region}::provider/default
      Events:
        ListCities:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cities
            Method: GET
            Auth:
              Authorizer: NONE
        ListCityPlaces:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cities/{cityId}/places
            Method: GET
            Auth:
              Authorizer: NONE
        GetPlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places/{placeId}
            Method: GET
            Auth:
              Authorizer: NONE
        CreatePlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places
            Method: POST
        UpdatePlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places/{placeId}
            Method: PUT
        DeletePlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /places/{placeId}
            Method: DELETE
        CreateUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /uploads
            Method: POST
        GeoSuggest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /geo/suggest
            Method: GET
        GeoPlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /geo/place
            Method: GET
        ListGuides:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /guides
            Method: GET
            Auth:
              Authorizer: NONE
        GetGuide:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /guides/{guideId}
            Method: GET
            Auth:
              Authorizer: NONE

  # --- AdminService: moderasyon (6.4) ------------------------------------
  AdminLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /esngo/${Stage}/admin
      RetentionInDays: !Ref LogRetentionDays

  AdminFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/functions/admin/handler.ts]
    Properties:
      FunctionName: !Sub esngo-${Stage}-admin
      Handler: handler.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref AdminLogs
      Policies:
        - Statement:
            - Sid: AdminImageUploadsOnly
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub ${MediaBucket.Arn}/cities/*
                - !Sub ${MediaBucket.Arn}/guides/*
      Events:
        SetPlaceVisibility:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/places/{placeId}
            Method: PATCH
        DeletePlace:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/places/{placeId}
            Method: DELETE
        CreateUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /admin/uploads
            Method: POST

  # --- ProfileService: herkese açık ESNer profilleri (7.1) ---------------
  ProfileLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /esngo/${Stage}/profile
      RetentionInDays: !Ref LogRetentionDays

  ProfileFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/functions/profile/handler.ts]
    Properties:
      FunctionName: !Sub esngo-${Stage}-profile
      Handler: handler.handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ProfileLogs
      Events:
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /profiles/{userId}
            Method: GET
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: for nextjs use next public env NEXT_PUBLIC_API_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  MapsApiKeyName:
    Description: Get the key value with "aws location describe-key" (NEXT_PUBLIC_LOCATION_API_KEY)
    Value: !Sub esngo-${Stage}-maps

  MediaCdnDomain:
    Description: CloudFront domain for images (NEXT_PUBLIC_MEDIA_CDN)
    Value: !GetAtt MediaCdn.DomainName
  MediaBucketName:
    Value: !Ref MediaBucket
