# ESN-GO – Frontend + Backend
# Root'tan çalıştır: docker compose up --build

services:
  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: esn-go-backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env.local
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
    container_name: esn-go-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DOCKER_ENV: "1"
    depends_on:
      - backend
    restart: unless-stopped
